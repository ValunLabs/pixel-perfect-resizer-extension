<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .tile { width: 440px; height: 280px; padding: 30px 32px; display: flex; flex-direction: column; justify-content: center; gap: 14px;
    background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 50%, #4f46e5 100%); color: #fff; }
  .head { display: flex; align-items: center; gap: 14px; }
  .head img { width: 64px; height: 64px; border-radius: 14px; box-shadow: 0 6px 16px rgba(0, 0, 0, .25); }
  .head b { font-size: 30px; letter-spacing: -0.02em; }
  .tag { font-size: 20px; font-weight: 600; line-height: 1.25; }
  .sub { font-size: 14px; opacity: .85; }
</style></head>
<body><div class="tile">
  <div class="head"><img src="../icons/icon128.png" alt=""><b>PixelPerfect</b></div>
  <div class="tag">Right-click any image to resize it</div>
  <div class="sub">100% client-side · No uploads · Free</div>
</div></body></html>
